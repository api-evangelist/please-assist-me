description: Please Assist Me (PAM) is an apartment-amenity and home-management service that partners with
  residential buildings to handle cleaning, errands, groceries, laundry, dry-cleaning, package handling,
  and custom special requests for residents. Dedicated per-building teams deliver the service, backed by
  a consumer mobile app (iOS and Android) and a web app for booking and account management, a 24-hour
  satisfaction guarantee, and body-camera transparency. Backed by Techstars. The company operates a
  consumer-facing product and publishes no public developer API, SDK, or developer portal at this time.
